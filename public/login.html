<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XPLUSHOP - Welcome Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="bg"><div class="stars"></div></div>

<nav>
  <div class="logo-pill">XPLUSHOP</div>
  <div class="nav-links">
    <a>Shop</a><a>Categories</a><a>Deals</a><a>Support</a>
  </div>
  <div class="nav-icons">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3m3-3h12l-1.5-6H5.25M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/></svg>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
  </div>
</nav>

<div class="main">
  <div class="left">
    <div class="x-wrap">
      <div class="x-glow"></div>
      <svg class="x-svg" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d8b4fe"/>
            <stop offset="25%" stop-color="#a78bfa"/>
            <stop offset="60%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#4c1d95"/>
          </linearGradient>
          <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="white" stop-opacity="0"/>
            <stop offset="50%" stop-color="white" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="M 18 14 L 84 70 L 18 126 L 46 126 L 98 72 L 32 14 Z" fill="url(#g1)"/>
        <path d="M 168 14 L 102 70 L 168 126 L 140 126 L 88 72 L 154 14 Z" fill="url(#g1)" opacity="0.95"/>
        <path d="M 18 14 L 32 14 L 98 72 L 84 70 Z" fill="#0a0614" opacity="0.5"/>
        <path d="M 28 22 L 88 76 L 82 82 L 22 28 Z" fill="white" opacity="0.12"/>
        <path d="M 148 18 L 106 66 L 112 72 L 162 22 Z" fill="white" opacity="0.22"/>
      </svg>
    </div>
    <div class="brand">XPLUSHOP</div>
    <div class="tagline">Power up your gear <span>&bull;</span> Shop the future</div>
  </div>

  <form class="card" id="loginForm" novalidate>
    <h2>Welcome Back!</h2>
    <div class="sub">Login to continue</div>

    <div id="alert" class="alert" role="alert" hidden></div>

    <label for="email">Email Address</label>
    <div class="input-wrap">
      <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
    </div>

    <label for="pass">Password</label>
    <div class="input-wrap">
      <input class="input" id="pass" name="password" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required />
      <button class="eye" type="button" aria-label="Toggle password visibility" onclick="togglePass()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>
    </div>

    <div class="row">
      <label class="remember"><input type="checkbox" id="remember" checked/> Remember me</label>
      <a class="link">Forgot password?</a>
    </div>

    <button class="btn" type="submit" id="submitBtn">Login</button>

    <div class="bottom">Don't have an account? <a class="link" href="/signup">Sign Up</a></div>
  </form>
</div>

<script src="/auth.js"></script>
<script>
function togglePass(){
  const p=document.getElementById('pass');
  p.type = p.type==='password'?'text':'password';
}
document.getElementById('loginForm').addEventListener('submit', async function(ev){
  ev.preventDefault();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('pass').value;
  const rememberMe=document.getElementById('remember').checked;
  if(!email||!password){ XPS.showAlert('Please fill in email and password.'); return; }
  await XPS.submit('/api/auth/login', { email, password, rememberMe }, 'submitBtn', 'Login');
});
</script>
</body>
</html>
